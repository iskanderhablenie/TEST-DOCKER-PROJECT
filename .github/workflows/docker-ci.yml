name: Build and push Docker images

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Dockerfiles
        run: |
          echo "Searching for Dockerfiles..."
          find ./test -type f -iname 'Dockerfile'

          test -f ./test/angular-app/Dockerfile
          test -f ./test/springboot/app/Dockerfile

      - name: Sign in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Angular image
        uses: docker/build-push-action@v7
        with:
          context: ./test/angular-app
          file: ./test/angular-app/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/angular-app:latest

      - name: Build and push Spring Boot image
        uses: docker/build-push-action@v7
        with:
          context: ./test/springboot/app
          file: ./test/springboot/app/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/springboot:latest